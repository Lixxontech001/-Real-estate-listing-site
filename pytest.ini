[pytest]
DJANGO_SETTINGS_MODULE = project.settings
python_files = tests.py test_*.py *_tests.py
addopts = -q --tb=short

# Test credentials live here, not in a .env file, so the suite runs on a clean
# checkout with no manual setup and behaves identically in CI.
# These are obviously-fake values and are never used outside the test env:
# project/settings/base.py still requires a real SECRET_KEY, DATABASE_URL and
# NOMINATIM_USER_AGENT when DJANGO_ENV=prod.
env =
    DJANGO_ENV=dev
    DEBUG=False
    SECRET_KEY=test-only-not-a-real-secret-0123456789abcdefghijklmnop
    ALLOWED_HOSTS=localhost,testserver
    SITE_URL=http://testserver
    SITE_NAME=Real-Estate (test)
    NOMINATIM_USER_AGENT=RealEstateTests/1.0 (https://example.com; test@example.com)
    EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
    DEFAULT_FROM_EMAIL=test@example.com
    GEOCODING_CACHE_SECONDS=0
