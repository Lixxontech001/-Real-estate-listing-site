# Babel configuration for extracting translatable strings.
#
# Django's own `makemessages` needs the GNU gettext binaries, which are not
# always present. Babel provides the same extraction and .po -> .mo
# compilation in pure Python, so translations can be built anywhere.
#
# Usage (from the repo root):
#   pybabel extract -F babel.cfg -o locale/messages.pot -c "TRANSLATORS" .
#   pybabel init -i locale/messages.pot -d locale -l de
#   pybabel compile -d locale -D
#
# With gettext installed, `python manage.py makemessages` works too.

[python: **.py]

[django: templates/**.html]
encoding = utf-8
extensions = jinja2

[jinja2: templates/**.html]
encoding = utf-8
