[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    */migrations/*,
    staticfiles,
    .venv,
    venv
# E203/W503 conflict with black
extend-ignore = E203, W503
per-file-ignores =
    core/templatetags/filters.py:F401

# Keep isort in black's style so `isort .` and `black .` never disagree,
# whether or not --profile is passed on the command line.
[isort]
profile = black
