{% load i18n %}
<!-- Inquiry form. Identity and the realtor's email are resolved server-side,
     so only listing_id is sent; user_id and realtor_email were removed because
     the old view trusted them from POST. -->
<form action="{% url 'user-contact' %}" method="POST">
  {% csrf_token %}
  <input type="hidden" name="listing_id" value="{{ listing.id }}">

  <div class="mb-3">
    <label for="inquiry-phone" class="form-label">{% translate "Phone" %}</label>
    <input type="tel" name="phone" id="inquiry-phone" class="form-control"
           value="{{ user.phone|default:'' }}" maxlength="100" required>
  </div>

  <div class="mb-3">
    <label for="inquiry-message" class="form-label">{% translate "Message" %}</label>
    <textarea name="message" id="inquiry-message" rows="4" class="form-control"
              maxlength="5000"
              placeholder='{% translate "Please enter message here..." %}' required></textarea>
  </div>

  <button type="submit" class="btn btn-secondary w-100">
    {% translate "Make an Inquiry" %}
  </button>
</form>
