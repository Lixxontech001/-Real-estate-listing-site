{% load i18n %}
<!-- Chat form, shown when the user already has an inquiry on this listing.
     user_id is not sent: the view derives identity from the session. -->
<form action="{% url 'chat' %}" method="POST">
  {% csrf_token %}
  <input type="hidden" name="contact_id" value="{{ contact }}">

  <div class="mb-3">
    <label for="chat-message" class="form-label">{% translate "Message" %}</label>
    <textarea name="message" id="chat-message" rows="4" class="form-control"
              maxlength="5000"
              placeholder='{% translate "Please enter message here..." %}' required></textarea>
  </div>

  <div class="d-grid gap-2">
    <button type="submit" class="btn btn-secondary">{% translate "Send message" %}</button>
    <a class="btn btn-primary" href="{% url 'chat-history' contact %}">
      {% translate "View history" %}
    </a>
  </div>
</form>
