{% load i18n %}
<div class="search">
  <form action="{% url 'search' %}" method="get" role="search">
    <div class="form-row">
      <div class="input-group col-12 col-md-3 mb-3">
        <label class="visually-hidden" for="{{ form.keywords.id_for_label }}">
          {% translate "Keywords" %}
        </label>
        <span class="input-group-text"><i class="fas fa-search" aria-hidden="true"></i></span>
        {{ form.keywords }}
      </div>

      <div class="input-group col-12 col-md-3 mb-3">
        <label class="visually-hidden" for="{{ form.city.id_for_label }}">
          {% translate "City" %}
        </label>
        <span class="input-group-text"><i class="fas fa-city" aria-hidden="true"></i></span>
        {{ form.city }}
      </div>

      <div class="input-group col-12 col-md-3 mb-3">
        <label class="visually-hidden" for="{{ form.state.id_for_label }}">
          {% translate "State" %}
        </label>
        <span class="input-group-text"><i class="fas fa-map-marker-alt" aria-hidden="true"></i></span>
        {{ form.state }}
      </div>

      <div class="input-group col-12 col-md-3 mb-3">
        <label class="visually-hidden" for="{{ form.listing_type.id_for_label }}">
          {% translate "Listing type" %}
        </label>
        <span class="input-group-text"><i class="fas fa-home" aria-hidden="true"></i></span>
        {{ form.listing_type }}
      </div>

      <div class="input-group col-12 col-md-3 mb-3">
        <label class="visually-hidden" for="{{ form.bedrooms.id_for_label }}">
          {% translate "Bedrooms" %}
        </label>
        <span class="input-group-text"><i class="fas fa-bed" aria-hidden="true"></i></span>
        {{ form.bedrooms }}
      </div>

      <div class="input-group col-12 col-md-3 mb-3">
        <label class="visually-hidden" for="{{ form.bathrooms.id_for_label }}">
          {% translate "Bathrooms" %}
        </label>
        <span class="input-group-text"><i class="fas fa-bath" aria-hidden="true"></i></span>
        {{ form.bathrooms }}
      </div>

      <div class="input-group col-12 col-md-3 mb-3">
        <label class="visually-hidden" for="{{ form.sqft.id_for_label }}">
          {% translate "Minimum area" %}
        </label>
        <span class="input-group-text"><i class="fas fa-ruler-combined" aria-hidden="true"></i></span>
        {{ form.sqft }}
      </div>

      <div class="input-group col-12 col-md-3 mb-3">
        <label class="visually-hidden" for="{{ form.price.id_for_label }}">
          {% translate "Maximum price" %}
        </label>
        <span class="input-group-text"><i class="fas fa-euro-sign" aria-hidden="true"></i></span>
        {{ form.price }}
      </div>
    </div>

    <button type="submit" class="btn btn-secondary">{% translate "Search" %}</button>
    <a href="{% url 'listings' %}" class="btn btn-outline-secondary">{% translate "Reset" %}</a>
  </form>
</div>
