{% load static i18n %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}{{ page_title|default:_("Home") }} | {{ domain_name }}{% endblock %}</title>
    <meta name="description" content="{{ page_description|default:page_default_description }}">
    <meta name="author" content="{{ domain_name }}">
    <link rel="canonical" href="{{ domain }}{{ request.path }}">

    {% for alt_code, alt_name in LANGUAGES %}
      {% if alt_code != LANGUAGE_CODE %}
        <link rel="alternate" hreflang="{{ alt_code }}" href="{{ domain }}{{ request.path }}">
      {% endif %}
    {% endfor %}

    <!-- Open Graph / social cards -->
    <meta property="og:site_name" content="{{ domain_name }}">
    <meta property="og:title" content="{{ page_title|default:domain_name }}">
    <meta property="og:description" content="{{ page_description|default:page_default_description }}">
    <meta property="og:url" content="{{ domain }}{{ request.path }}">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="{% static 'img/logo/favicon.ico' %}" sizes="any">
    <link rel="apple-touch-icon" sizes="120x120-precomposed"
          href="{% static 'img/logo/apple-touch-icon-120x120-precomposed.png' %}">
    <link rel="apple-touch-icon" sizes="152x152-precomposed"
          href="{% static 'img/logo/apple-touch-icon-152x152-precomposed.png' %}">

    <link rel="stylesheet" href="{% static 'css/all.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/lightbox.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/django-translation-flags.min.css' %}">

    {% block structured_data %}{% endblock %}
</head>
